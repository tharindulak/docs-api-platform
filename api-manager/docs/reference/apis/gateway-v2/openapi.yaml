openapi: 3.0.3
info:
  version: v2.3
  title: WSO2 API Manager - Gateway
  description: |
    This document specifies a **RESTful API** for WSO2 **API Manager** - Gateway.
    Please see [full swagger definition](https://raw.githubusercontent.com/wso2/carbon-apimgt/master/components/apimgt/org.wso2.carbon.apimgt.rest.api.gateway/src/main/resources/gateway-api.yaml) of the API which is written using [swagger 2.0](http://swagger.io/) specification.
  contact:
    name: WSO2
    url: https://wso2.com/api-manager/
    email: architecture@wso2.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://apis.wso2.com/api/am/gateway/v2
paths:
  /redeploy-api:
    post:
      summary: Redeploy the API in the gateway
      description: |
        This operation is used to re deploy an API in the gateway. If the Tenant domain is not provided carbon.super
        will be picked as the Tenant domain.
      operationId: redployAPI
      parameters:
        - $ref: '#/components/parameters/apiName'
        - $ref: '#/components/parameters/version'
        - $ref: '#/components/parameters/tenantDomain'
      responses:
        '200':
          description: |
            OK.
            API successfully deployed in the Gateway.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployResponse'
        '400':
          description: |
            Bad Request.
            Invalid request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            Not Found.
            Requested API does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-code-samples:
        - lang: Curl
          source: 'curl -k -X POST "https://127.0.0.1:9443/api/am/gateway/v2/redeploy-api?apiName=PizzaAPI&version=1.0&tenantDomain=registry.com" -H "Authorization: Basic YWRtaW46YWRtaW4="'
  /undeploy-api:
    post:
      summary: Undeploy the API in the gateway
      description: |
        This operation is used to undeploy an API in the gateway. If the Tenant domain is not provided carbon.super will
        be picked as the Tenant domain.
      operationId: undeployAPI
      parameters:
        - $ref: '#/components/parameters/apiName'
        - $ref: '#/components/parameters/version'
        - $ref: '#/components/parameters/tenantDomain'
      responses:
        '200':
          description: |
            OK.
            API successfully undeployed from the Gateway.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployResponse'
        '400':
          description: |
            Bad Request.
            Invalid request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            Not Found.
            Requested API does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-code-samples:
        - lang: Curl
          source: 'curl -k -X POST "https://127.0.0.1:9443/api/am/gateway/v2/undeploy-api?apiName=PizzaAPI&version=1.0&tenantDomain=registry.com" -H "Authorization: Basic YWRtaW46YWRtaW4="'
  /server-startup-healthcheck:
    get:
      summary: |
        Health check to check if all the API are deployed during the server startup
      description: |
        Health check to check if all the API are deployed during the server startup
      responses:
        '200':
          description: |
            OK.
        '500':
          description: |
            Internal Server Error.
      security:
        - OAuth2Security: []
      x-code-samples:
        - lang: Curl
          source: curl -k "https://localhost:9443/api/am/gateway/v2/server-startup-healthcheck"
  /api-artifact:
    get:
      summary: Get API artifact from the storage
      description: |
        This operation is used to get the local entries, sequences and endpoints from the storage. If the Tenant domain
        is not provided carbon.super will be picked as the Tenant domain.
      operationId: getAPIArtifacts
      parameters:
        - $ref: '#/components/parameters/apiName'
        - $ref: '#/components/parameters/version'
        - $ref: '#/components/parameters/tenantDomain'
      responses:
        '200':
          description: |
            OK.
            API artifact successfully retrieved from the storage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIArtifact'
        '400':
          description: |
            Bad Request.
            Invalid request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            Not Found.
            Requested API does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-code-samples:
        - lang: Curl
          source: 'curl -k "https://127.0.0.1:9443/api/am/gateway/v2/api-artifact?apiName=PizzaAPI&version=1.0&tenantDomain=registry.com" -H "Authorization: Basic YWRtaW46YWRtaW4="'
  /local-entry:
    get:
      summary: Get Local Entry from the storage
      description: |
        This operation is used to get local entry from the storage.If the Tenant domain is not provided carbon.super
        will be picked as the Tenant domain.
      operationId: getLocalEntries
      parameters:
        - $ref: '#/components/parameters/apiName'
        - $ref: '#/components/parameters/version'
        - $ref: '#/components/parameters/tenantDomain'
      responses:
        '200':
          description: |
            OK.
            Local entry for the API successfully retrieved from the storage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalEntry'
        '400':
          description: |
            Bad Request.
            Invalid request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            Not Found.
            Requested API does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-code-samples:
        - lang: Curl
          source: 'curl -k "https://127.0.0.1:9443/api/am/gateway/v2/local-entry?apiName=PizzaAPI&version=1.0&tenantDomain=registry.com" -H "Authorization: Basic YWRtaW46YWRtaW4="'
  /sequence:
    get:
      summary: Get sequences from the storage
      description: |
        This operation is used to get the API sequence from the storage. If the Tenant domain is not provided carbon.super
        will be picked as the Tenant domain.
      operationId: getSequences
      parameters:
        - $ref: '#/components/parameters/apiName'
        - $ref: '#/components/parameters/version'
        - $ref: '#/components/parameters/tenantDomain'
      responses:
        '200':
          description: |
            OK.
            Sequences for the API successfully retrieved from the storage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sequences'
        '400':
          description: |
            Bad Request.
            Invalid request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            Not Found.
            Requested API does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-code-samples:
        - lang: Curl
          source: 'curl -k "https://127.0.0.1:9443/api/am/gateway/v2/sequence?apiName=PizzaAPI&version=1.0&tenantDomain=registry.com" -H "Authorization: Basic YWRtaW46YWRtaW4="'
  /end-points:
    get:
      summary: Get end-points from the storage for the API
      description: |
        This operation is used to get the end-points from the storage. If the Tenant domain is not provided
        carbon.super will be picked as the Tenant domain.
      operationId: getEndpoints
      parameters:
        - $ref: '#/components/parameters/apiName'
        - $ref: '#/components/parameters/version'
        - $ref: '#/components/parameters/tenantDomain'
      responses:
        '200':
          description: |
            OK.
            End-points successfully retrieved from the storage for the API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoints'
        '400':
          description: |
            Bad Request.
            Invalid request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            Not Found.
            Requested API does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-code-samples:
        - lang: Curl
          source: 'curl -k "https://127.0.0.1:9443/api/am/gateway/v2/end-points?apiName=PizzaAPI&version=1.0&tenantDomain=registry.com" -H "Authorization: Basic YWRtaW46YWRtaW4="'
  /apis:
    get:
      x-code-samples:
        - lang: Curl
          source: 'curl -k -X GET "https://127.0.0.1:9443/api/am/gateway/v2/apis?context=/pizza/1.0.0&version=1.0&tenantDomain=registry.com" -H "Authorization: Basic YWRtaW46YWRtaW4="'
      summary: Get the list of APIS by providing context and version.
      description: |
        This operation is used to get the API information from storage. If the Tenant domain is not provided
        carbon.super will be picked as the Tenant domain.
      parameters:
        - name: context
          in: query
          description: |
            Context of the API
          schema:
            type: string
        - name: version
          in: query
          description: |
            version of the API
          schema:
            type: string
        - name: tenantDomain
          in: query
          description: |
            Tenant Domain of the API
          schema:
            type: string
      tags:
        - Get API Info
      responses:
        '200':
          description: |
            OK.
            APIS successfully retrieved from the storage for the API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /apis/{apiId}:
    get:
      x-code-samples:
        - lang: Curl
          source: 'curl -k -X GET "https://127.0.0.1:9443/api/am/gateway/v2/apis/7a2298c4-c905-403f-8fac-38c73301631f?tenantDomain=registry.com" -H "Authorization: Basic YWRtaW46YWRtaW4="'
      summary: Get the subscription information of an API by providing the API uuid.
      description: |
        This operation is used to get the subscription information of an API from storage. If the Tenant domain is not provided
        carbon.super will be picked as the Tenant domain.
      parameters:
        - name: apiId
          in: path
          required: true
          description: |
            API ID of the API
          schema:
            type: string
        - name: tenantDomain
          in: query
          description: |
            Tenant Domain of the API
          schema:
            type: string
      tags:
        - Get API Info
      responses:
        '200':
          description: |
            OK.
            APIS successfully retrieved from the storage for the API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /applications:
    get:
      x-code-samples:
        - lang: Curl
          source: 'curl -k -X GET "https://127.0.0.1:9443/api/am/gateway/v2/applications?name=PizzaAPP&tenantDomain=registry.com" -H "Authorization: Basic YWRtaW46YWRtaW4="'
      summary: Get the applications information by providing the application name or uuid.
      description: |
        This operation is used to get the application information from storage. If the Tenant domain is not
        provided carbon.super will be picked as the Tenant domain.
      parameters:
        - name: name
          in: query
          description: |
            Name of the Application
          schema:
            type: string
        - name: uuid
          in: query
          description: |
            UUID of the Application
          schema:
            type: string
        - name: tenantDomain
          in: query
          description: |
            Tenant Domain of the Application
          schema:
            type: string
      tags:
        - Get Application Info
      responses:
        '200':
          description: |
            OK.
            Applications successfully retrieved from the storage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /subscriptions:
    get:
      x-code-samples:
        - lang: Curl
          source: 'curl -k -X GET "https://127.0.0.1:9443/api/am/gateway/v2/subscriptions?apiUUID=d290f1ee-6c54-4b01-90e6-d701748f0851&appUUID=d290f1ee-6c54-4b01-90e6-d701748f0851&tenantDomain=registry.com" -H "Authorization: Basic YWRtaW46YWRtaW4="'
      summary: Get the subscriptions meta information of an api by providing the api uuid and application uuid.
      description: |
        This operation is used to get the subscription information of an API from storage. If the Tenant domain is not provided
        carbon.super will be picked as the Tenant domain.
      parameters:
        - name: apiUUID
          in: query
          description: |
            UUID of the API
          schema:
            type: string
        - name: appUUID
          in: query
          description: |
            UUID of the Application
          schema:
            type: string
        - name: tenantDomain
          in: query
          description: |
            Tenant Domain of the Application
          schema:
            type: string
      tags:
        - Get Subscription Info
      responses:
        '200':
          description: |
            OK.
            Subscriptions successfully retrieved from the storage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    DeployResponse:
      title: Deploy API Response
      required:
        - deployStatus
      properties:
        deployStatus:
          description: |
            This attribute declares whether deployment task is successful or failed.
          type: string
          enum:
            - DEPLOYED
            - UNDEPLOYED
            - ERROR
          example: DEPLOYED
        jsonPayload:
          description: |
            Attributes that returned after the api deployment
          type: string
    Endpoints:
      title: Endpoints Response
      properties:
        endpoints:
          description: |
            The end points which has been deployed in the gateway
          type: array
          items:
            type: string
            example: <endpoint xmlns="http://ws.apache.org/ns/synapse" name="PizzaShackAPI--v1.0.0_APIproductionEndpoint"><http uri-template="https://localhost:9443/am/sample/pizzashack/v1/api/"><timeout><responseAction>fault</responseAction></timeout></http><property name="ENDPOINT_ADDRESS" value="https://localhost:9443/am/sample/pizzashack/v1/api/"/></endpoint>
    Sequences:
      title: Sequences Response
      properties:
        sequences:
          description: |
            The sequences which has been deployed in the gateway
          type: array
          items:
            type: string
            example: <sequence xmlns="http://ws.apache.org/ns/synapse" name="PizzaShackAPI--v1.0.0_APIproductionEndpoint"><http uri-template="https://localhost:9443/am/sample/pizzashack/v1/api/"><timeout><responseAction>fault</responseAction></timeout></http><property name="ENDPOINT_ADDRESS" value="https://localhost:9443/am/sample/pizzashack/v1/api/"/></sequnce>
    LocalEntry:
      title: LocalEntry Response
      properties:
        localEntries:
          description: |
            The local entries which has been deployed in the gateway
          type: array
          items:
            type: string
            example: "localEntry xmlns=\"http://ws.apache.org/ns/synapse\" key=\"ga-config-key\" type=\"1\"><GoogleAnalyticsTracking xmlns=\"\">\n\t<!--Enable/Disable Google Analytics Tracking -->\n\t<Enabled>false</Enabled>\n\n\t<!-- Google Analytics Tracking ID -->\n\t<TrackingID>UA-XXXXXXXX-X</TrackingID>\n\n</GoogleAnalyticsTracking></localEntry>"
    APIArtifact:
      title: API Artifact Response
      properties:
        api:
          type: string
          description: |
            API Artifact deployed in Gateway.
          example: ''
    Error:
      title: Error object returned with 4XX HTTP status
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int64
          description: Error code
        message:
          type: string
          description: Error message.
        description:
          type: string
          description: |
            A detail description about the error message.
        moreInfo:
          type: string
          description: |
            Preferably an url with more details about the error.
        error:
          type: array
          description: |
            If there are more than one error list them out.
            For example, list out validation errors by each field.
          items:
            $ref: '#/components/schemas/ErrorListItem'
    ErrorListItem:
      title: Description of individual errors that may have occurred during a request.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Error code
        message:
          type: string
          description: |
            Description about individual errors occurred
    APIInfo:
      title: Subscription Information for API.
      properties:
        apiUUID:
          type: string
          description: UUID of API.
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        apiId:
          type: integer
          example: 1
        provider:
          type: string
          description: API Provider name.
          example: admin
        name:
          type: string
          description: Name of the API
          example: PizzaAPI
        version:
          type: string
          description: Version of the API.
          example: v1.0.0
        context:
          type: string
          description: Context of the API.
          example: /pizza/v1.0.0
        policy:
          type: string
          description: API level throttling policy.
          example: Gold
        apiType:
          type: string
          description: Type of the API.
          example: APIProduct
        isDefaultVersion:
          type: boolean
          description: Whether this is the default version of the API.
          example: false
        status:
          type: string
          description: Status of API.
          example: Published
        urlMappings:
          type: array
          items:
            $ref: '#/components/schemas/URLMapping'
        subscripitons:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionInfo'
    SubscriptionInfo:
      properties:
        subscriptionUUID:
          type: string
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        subscriptionPolicy:
          type: string
          example: Gold
        status:
          type: string
          example: UnBlocked
        application:
          $ref: '#/components/schemas/ApplicationInfo'
    ApplicationInfo:
      properties:
        uuid:
          type: string
          example: d290f1ee-6c54-4b01-90e6-d701848f0851
        id:
          type: integer
          example: 1
        name:
          type: string
          example: PizzaAPP
        subName:
          type: string
          example: admin
        policy:
          type: string
          description: Application level throtting policy.
          example: Gold
        tokenType:
          type: string
          description: type of the token.
          example: JWT
        attributes:
          type: object
          additionalProperties:
            type: string
        keys:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationKeyMapping'
    ApplicationKeyMapping:
      properties:
        consumerKey:
          type: string
          example: d290f1ee-6c54-4b01-90e6-d701848f0851
        keyType:
          type: string
          example: Production
        keyManager:
          type: string
          example: Resident Key Manager
    URLMapping:
      properties:
        authScheme:
          type: string
          example: Application & Application User
        throttlingPolicy:
          type: string
          example: Unlimited
        httpMethod:
          type: string
          example: GET
        urlPattern:
          type: string
          example: /menu
        scopes:
          type: array
          items:
            type: string
            example: read
    APIList:
      title: API List
      properties:
        count:
          type: integer
          description: |
            Number of APIs returned.
          example: 1
        list:
          type: array
          items:
            $ref: '#/components/schemas/APIMetaData'
    APIMetaData:
      properties:
        apiUUID:
          type: string
          description: UUID of API.
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        apiId:
          type: integer
          example: 1
        provider:
          type: string
          description: API Provider name.
          example: admin
        name:
          type: string
          description: Name of the API
          example: PizzaAPI
        version:
          type: string
          description: Version of the API.
          example: v1.0.0
        context:
          type: string
          description: Context of the API.
          example: /pizza/v1.0.0
        policy:
          type: string
          description: API level throttling policy.
          example: Gold
        apiType:
          type: string
          description: Type of the API.
          example: APIProduct
        isDefaultVersion:
          type: boolean
          description: Whether this is the default version of the API.
          example: false
        status:
          type: string
          description: Status of API.
          example: Published
    ApplicationList:
      title: Application List
      properties:
        count:
          type: integer
          description: |
            Number of Applications returned.
          example: 1
        list:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationInfo'
    Subscription:
      properties:
        subscriptionId:
          type: integer
        policyId:
          type: string
        apiId:
          type: integer
        appId:
          type: integer
        subscriptionState:
          type: string
  parameters:
    apiName:
      name: apiName
      in: query
      required: true
      description: |
        Name of the API
      schema:
        type: string
    version:
      name: version
      in: query
      required: true
      description: |
        version of the API
      schema:
        type: string
    tenantDomain:
      name: tenantDomain
      in: query
      description: |
        Tenant Domain of the API
      schema:
        type: string
  responses:
    BadRequest:
      description: Bad Request. Invalid request or validation error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not Found. The specified resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
